<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Applies the saved theme (else the OS preference, else dark) before first
    // paint so the page never flashes the wrong one. theme.js wires the toggle.
    (function () {
      var t = null;
      try { t = localStorage.getItem('rg-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      r.setAttribute('data-bs-theme', t);
    })();
  </script>
  <title>Login — RubberGuard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}?v={{ STATIC_VERSION }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-theme">
    <button type="button" class="theme-toggle" aria-label="Switch to light mode">
      <span class="theme-opt to-light" aria-hidden="true"><i class="bi bi-sun-fill"></i><span class="theme-word">Light</span></span>
      <span class="theme-opt to-dark" aria-hidden="true"><i class="bi bi-moon-stars-fill"></i><span class="theme-word">Dark</span></span>
    </button>
  </div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">
        <i class="bi bi-shield-fill"></i>
        <i class="bi bi-tree-fill brand-icon-tree"></i>
      </div>
      <div class="auth-brand-title">RubberGuard</div>
      <div class="auth-brand-sub">Hevea brasiliensis Disease Detection System</div>
    </div>

    {% if form.errors %}
    <div class="auth-error" role="alert">
      <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i> Invalid username or password. Please try again.
    </div>
    {% endif %}

    {% if messages %}
      {% for message in messages %}
      <div class="{% if message.tags == 'error' %}auth-error{% else %}auth-success{% endif %}">
        <i class="bi {% if message.tags == 'error' %}bi-exclamation-circle-fill{% else %}bi-check-circle-fill{% endif %}"></i> {{ message }}
      </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="auth-field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control-rg" value="{{ form.username.value|default:'' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required{% if not form.username.value %} autofocus{% endif %}>
      </div>
      <div class="auth-field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control-rg" autocomplete="current-password" required{% if form.username.value %} autofocus{% endif %}>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Log In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{% url 'register' %}">Create one</a>
    </div>
  </div>
  <script src="{% static 'js/theme.js' %}?v={{ STATIC_VERSION }}"></script>
</body>
</html>
